[package]
name = "chase_recon"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", optional = true }
csv = "1.4.0"
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"], optional = true }
web-time = "1"

[features]
# The local HTTP server and the command line. The WebAssembly build turns this off.
default = ["server"]
server = ["dep:axum", "dep:tokio"]

[[bin]]
name = "chase_recon"
path = "src/main.rs"
required-features = ["server"]
