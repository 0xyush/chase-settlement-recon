[package]
name = "recon_wasm"
version = "0.1.0"
edition = "2024"
description = "Both recon engines compiled to WebAssembly, so the dashboards run them in the browser."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chase_recon = { path = "../engines/commerce", default-features = false }
orbital_recon = { path = "../engines/orbital", default-features = false }
serde = "1"
serde_json = "1"
wasm-bindgen = "=0.2.129"
